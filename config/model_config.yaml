# model_config.yaml - FIXED: aligned with actual OpenAI usage

models:
  primary:
    name: 'gpt-4o-mini'        # FIX: was claude-sonnet-4-20250514
    max_tokens: 2000
    temperature: 0.3

  fallback:
    name: 'gpt-3.5-turbo'
    max_tokens: 2000
    temperature: 0.3

  embeddings:
    name: 'paraphrase-multilingual-MiniLM-L12-v2'   # sentence-transformers (local)
    dimensions: 384

agents:
  government_agent:
    model: 'gpt-4o-mini'
    temperature: 0.3
    max_tokens: 2000

  business_agent:
    model: 'gpt-4o-mini'
    temperature: 0.3
    max_tokens: 2000

  expert_agent:
    model: 'gpt-4o-mini'
    temperature: 0.3
    max_tokens: 2000

  moderator:
    model: 'gpt-4o-mini'
    temperature: 0.3
    max_tokens: 900